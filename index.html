<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="novel-build" content="20261022-092111-5603bf9b">
  <title>Detective</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #090c14; color: #fff; font-family: system-ui, sans-serif; }
    #game { position: fixed; left: 0; top: 0; width: 100%; height: 100%; height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 16px; padding: 24px; background: #090c14; }
    #status[hidden] { display: none; }
    progress { width: min(70vw, 320px); margin: auto; }
    #update { position:fixed; z-index:20; inset: max(12px,env(safe-area-inset-top)) 12px auto;
      padding:16px; background:#243146; border:1px solid #a9bddd; border-radius:8px; }
    #update[hidden] { display:none; }
    #update button { margin:8px 8px 0 0; min-height:44px; padding:8px 16px; cursor:pointer; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" tabindex="0" aria-label="Визуальная новелла"></canvas>
    <div id="status" role="status"><span id="message">Загрузка новеллы…</span><progress id="progress" max="1" value="0"></progress></div>
  </main>
  <aside id="update" hidden role="status">
    Доступна новая версия. Обновление начнёт игру заново.
    <div><button id="update-now">Обновить и начать заново</button><button id="update-later">Позже</button></div>
  </aside>
  <script src="updates.js"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const status = document.getElementById('status');
    const message = document.getElementById('message');
    // visualViewport учитывает адресную строку, масштаб страницы и доступную область на телефоне.
    function fitVisibleViewport() {
      const viewport = window.visualViewport;
      const game = document.getElementById('game');
      game.style.width = (viewport ? viewport.width : window.innerWidth) + 'px';
      game.style.height = (viewport ? viewport.height : window.innerHeight) + 'px';
      game.style.left = (viewport ? viewport.offsetLeft : 0) + 'px';
      game.style.top = (viewport ? viewport.offsetTop : 0) + 'px';
    }
    fitVisibleViewport();
    window.addEventListener('resize', fitVisibleViewport);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', fitVisibleViewport);
      window.visualViewport.addEventListener('scroll', fitVisibleViewport);
    }
    window.novelUpdates = { start() {
      if (this.started) return;
      this.started = true;
      const id = document.querySelector('meta[name="novel-build"]').content;
      if (id.startsWith('__')) return; // Preview before a stamped Web build.
      const checker = NovelRelease.createUpdateChecker({
        currentId: id,
        manifestUrl: new URL('../../version.txt', new URL('.', location.href)).href,
        fetch: window.fetch.bind(window),
        onUpdate: release => {
          document.getElementById('update').hidden = false;
          document.getElementById('update-now').onclick = () => location.assign(release.url);
        }
      });
      document.getElementById('update-later').onclick = () => document.getElementById('update').hidden = true;
      checker.check();
      setInterval(() => { if (!document.hidden) checker.check(); }, 60000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) checker.check(); });
    } };
    function fail(error) {
      status.hidden = false;
      message.textContent = 'Не удалось запустить новеллу. Обновите страницу или попробуйте другой браузер.';
      document.getElementById('progress').hidden = true;
      console.error(error);
    }
    const config = {
      dataUrl: 'Build/BuildReady.data',
      frameworkUrl: 'Build/BuildReady.framework.js',
      codeUrl: 'Build/BuildReady.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "DefaultCompany",
      productName: "Detective",
      productVersion: "1.0",
      // Ограничиваем число пикселей на телефонах с высоким DPI.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      matchWebGLToCanvasSize: true,
      showBanner: (text, type) => { if (type === 'error') fail(text); else console.warn(text); }
    };
    const loader = document.createElement('script');
    loader.src = 'Build/BuildReady.loader.js';
    loader.onerror = () => fail('Unity loader unavailable');
    loader.onload = () => createUnityInstance(canvas, config, value => {
      document.getElementById('progress').value = value;
    }).then(() => { status.hidden = true; canvas.focus(); }).catch(fail);
    document.body.appendChild(loader);
    canvas.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
